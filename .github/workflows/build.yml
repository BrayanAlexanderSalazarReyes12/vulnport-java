name: Build VulnPort Java

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build WAR
        run: mvn -B clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: vulnport-java-war
          path: target/vulnport-java.war
